# Project-local Codex configuration.
# This file is loaded only for this trusted project and overrides user defaults.

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[agents]
enabled = true
default_subagent_model = "gpt-5.6-luna"
# max is the highest reasoning level supported by GPT-5.6 Luna.
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 2
