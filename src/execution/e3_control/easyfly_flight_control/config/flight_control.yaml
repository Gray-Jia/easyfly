# flight_control.yaml — setpoint 生成与安全边界参数
#
flight_controller:
  ros__parameters:
    control_rate: 20.0
    land_timeout: 60.0
    max_altitude: 50.0
    max_horizontal_speed: 20.0
    # EGO may need bounded collision-replan retries before its first READY
    # /position_cmd.  This does not change the action deadline or post-start
    # 0.5s stream watchdog.
    trajectory_startup_grace: 8.0
