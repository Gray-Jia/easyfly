# EasyFly P4 障碍表征配置 (M4.0)
# 输入为 easyfly_pointcloud_filter 的 base_link 系点云, 本节点变换到 world 系处理
semantic_map:
  # ---- 话题/服务 ----
  input_topic: /pointcloud_filtered
  uav_state_topic: /uav_state     # 独立飞行状态，用于安全地面初始化
  output_topic: /obstacles            # ObstacleInfoArray
  grid_topic: /occupancy_grid         # OccupancyGrid (供全局规划)
  marker_topic: /obstacle_markers     # RViz 立方体
  service_name: /get_obstacles        # GetObstacles srv

  # ---- 坐标系 ----
  world_frame: odom                   # 障碍输出系 (低空任务短航程, odom 即可; 全局建图需求出现再切 map)
  base_frame: base_link               # 车辆位姿参考系 (用于 TF 跳变守卫与地面相对高度校验)

  # ---- 地面平面候选与可信跟踪 ----
  plane_distance_threshold: 0.12      # 地面平面厚度 [m] (内点距离阈值)
  plane_max_tilt_rad: 0.15            # 候选平面最大相对水平倾角 [rad]
  plane_min_inliers: 50               # 候选最少内点数
  plane_min_inlier_ratio: 0.15        # 候选最少内点比例
  # 实测落地净空约 0.053-0.054m；0.03m 保留约 0.02m 裕量并拒绝零/机体同高平面
  ground_min_clearance: 0.03          # 地面相对 base_frame 的最小垂直间距 [m]
  ground_max_distance_below_vehicle: 8.0  # 地面相对车辆的最大间距 [m]
  ground_init_consecutive_frames: 3    # 初始化所需连续一致候选帧
  ground_init_max_z_difference: 0.25    # 初始化候选平面最大高度差 [m]
  ground_init_max_normal_angle_rad: 0.12 # 初始化候选法向最大夹角 [rad]
  ground_max_innovation_z: 0.45         # 已初始化候选相对历史模型最大高度创新 [m]
  ground_max_innovation_angle_rad: 0.15 # 已初始化候选法向最大创新 [rad]
  ground_smoothing_alpha: 0.25          # 合法候选更新 EMA 系数
  # fresh connected+pose_valid+disarmed permits initialization; armed restarts fail closed
  ground_init_state_timeout: 1.0         # /uav_state 新鲜度 [s]
  tf_guard_jump_distance: 1.0           # base_frame 水平平移跳变门限 [m]
  tf_guard_init_consecutive_frames: 3   # TF 基线初始化连续帧
  tf_guard_reject_limit: 10             # 连续跳变后允许重置基线的帧数
  obstacle_z_max: 4.0                 # 关心高度上限 [m, 离拟合地面]

  # ---- 欧式聚类 ----
  cluster_tolerance: 0.6              # 簇内点间距阈值 [m] (兼顾大物体成簇与近距目标不合并)
  cluster_min_points: 5               # 最小簇点数 (配 5 帧累积, 20m 行人约 30 点)
  cluster_max_points: 100000
  accumulate_frames: 5                # 滑动窗口累积帧数 (远目标增密; 飞行中目标会有 K 帧拖尾)
  max_obstacle_size: 8.0              # 单簇包围盒上界 [m], 超过视为地面残留/噪声链

  # ---- 占据栅格 ----
  inflate_radius: 0.7                 # 障碍足迹膨胀 [m] (含栅格/跟踪误差裕量；低于 0.7 将被提升)
  verbose: true                      # 逐帧聚类统计日志 (调参用)
  grid_persist_frames: 20             # 占据保持帧数 (≈3s @7Hz; 漏检不立即可穿越)
  grid_resolution: 0.2                # [m/cell]
  grid_width: 100.0                   # 以 odom 原点为中心 [m]
  grid_height: 100.0
