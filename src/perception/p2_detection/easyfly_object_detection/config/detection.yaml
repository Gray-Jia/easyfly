# EasyFly P2 目标检测配置
# ============================================================
# 换模型 (如自定义杂草检测) 只需改:
#   model_path  → 新 .onnx 文件
#   class_names → 训练 data.yaml 中的类别表 (顺序必须一致!)
#   imgsz       → 训练时的输入尺寸
# 注意: ONNX 导出建议 opset 12 + IR version ≤ 10 (onnxruntime 1.23 兼容)
# ============================================================
detection:
  # ---- 后端 ----
  backend: onnx            # onnx | tensorrt(预留) | openvino(预留)
  model_path: /home/jia/easyfly_ws/models/yolo11n.onnx
  imgsz: 640               # 模型输入边长 (与导出一致)

  # ---- 类别表 (COCO 80 类, 顺序与官方训练一致) ----
  class_names: [person, bicycle, car, motorcycle, airplane, bus, train, truck,
                boat, traffic light, fire hydrant, stop sign, parking meter,
                bench, bird, cat, dog, horse, sheep, cow, elephant, bear,
                zebra, giraffe, backpack, umbrella, handbag, tie, suitcase,
                frisbee, skis, snowboard, sports ball, kite, baseball bat,
                baseball glove, skateboard, surfboard, tennis racket, bottle,
                wine glass, cup, fork, knife, spoon, bowl, banana, apple,
                sandwich, orange, broccoli, carrot, hot dog, pizza, donut,
                cake, chair, couch, potted plant, bed, dining table, toilet,
                tv, laptop, mouse, remote, keyboard, cell phone, microwave,
                oven, toaster, sink, refrigerator, book, clock, vase,
                scissors, teddy bear, hair drier, toothbrush]

  # ---- 阈值 ----
  conf_threshold: 0.35     # 置信度阈值
  nms_threshold: 0.45      # NMS IoU 阈值
  max_detections: 100      # 单帧最大目标数

  # ---- 运行 ----
  use_gpu: true            # CUDA EP; 加载失败自动回退 CPU EP
  gpu_device_id: 0
  max_fps: 30.0            # 处理节流上限 (丢帧策略)

  # ---- 话题 ----
  input_topic: /camera/color/image_raw
  output_topic: /detections
  publish_debug_image: true  # /detections_debug_image (仅在有订阅者时发布)
